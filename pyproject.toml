[project]
name = "trading-report"
version = "0.1.0"
description = "本機股票交易正規化、FIFO 配對與明細報表系統"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "openpyxl>=3.1.5",
    "python-calamine>=0.9.1",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
trading-report = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
